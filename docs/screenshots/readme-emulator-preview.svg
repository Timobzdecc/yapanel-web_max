<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Интерактивный 3D-эмулятор панели управления Станцией Макс">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11131b"/>
      <stop offset="55%" stop-color="#171925"/>
      <stop offset="100%" stop-color="#201512"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#3a3e4d"/>
      <stop offset="35%" stop-color="#282b36"/>
      <stop offset="100%" stop-color="#191b23"/>
    </linearGradient>
    <linearGradient id="topCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e313d"/>
      <stop offset="100%" stop-color="#171820"/>
    </linearGradient>
    <linearGradient id="ringGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="50%" stop-color="#ffc14d"/>
      <stop offset="100%" stop-color="#ff477e"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff8c2b"/>
    </linearGradient>
    <radialGradient id="ambient" cx="18%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
      <circle cx="6" cy="6" r="1" fill="#000000" fill-opacity="0.28"/>
    </pattern>
    <pattern id="ledDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.1" fill="#232635"/>
    </pattern>
  </defs>

  <rect width="920" height="340" rx="22" fill="url(#bg)" stroke="#2c3042" stroke-width="1.5"/>
  <rect width="920" height="340" rx="22" fill="url(#ambient)"/>

  <!-- Left Column: Station Max 3D Prism -->
  <g transform="translate(52, 26)">
    <!-- Soft Drop Shadow -->
    <ellipse cx="100" cy="256" rx="84" ry="14" fill="#000000" fill-opacity="0.6"/>
    <!-- Dark Bottom Plinth -->
    <rect x="20" y="226" width="160" height="24" rx="12" fill="#0e1017" stroke="#2c3040" stroke-width="1"/>
    <!-- Main Acoustic Body -->
    <rect x="14" y="22" width="172" height="222" rx="26" fill="url(#bodyGrad)" stroke="#4c5266" stroke-width="1.5"/>
    <rect x="14" y="22" width="172" height="222" rx="26" fill="url(#mesh)"/>
    <!-- Subtle Edge Highlight -->
    <line x1="28" y1="42" x2="28" y2="232" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round"/>

    <!-- Top Control Plate & Glowing LED Ring -->
    <ellipse cx="100" cy="26" rx="82" ry="18" fill="url(#topCap)" stroke="#555c72" stroke-width="1.4"/>
    <ellipse cx="100" cy="26" rx="68" ry="13" fill="none" stroke="url(#ringGlow)" stroke-width="4">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Top Buttons (Mute, Center Alice, Vol) -->
    <circle cx="100" cy="26" r="6" fill="#ff6a00"/>
    <circle cx="64" cy="26" r="2.6" fill="#7c8299"/>
    <circle cx="136" cy="26" r="2.6" fill="#7c8299"/>

    <!-- Front 25x16 LED Matrix Display -->
    <rect x="44" y="88" width="112" height="72" rx="10" fill="#090a0f" stroke="#2f3446" stroke-width="1.5"/>
    <rect x="48" y="92" width="104" height="64" rx="6" fill="url(#ledDots)"/>
    <g fill="#ff7b24">
      <rect x="56" y="130" width="7" height="18" rx="2">
        <animate attributeName="height" values="12;38;18;44;12" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="136;110;130;104;136" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="67" y="118" width="7" height="30" rx="2">
        <animate attributeName="height" values="30;14;44;20;30" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="118;134;104;128;118" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect x="78" y="108" width="7" height="40" rx="2">
        <animate attributeName="height" values="42;22;36;12;42" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="106;126;112;136;106" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect x="89" y="122" width="7" height="26" rx="2">
        <animate attributeName="height" values="16;46;24;34;16" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="132;102;124;114;132" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="100" y="112" width="7" height="36" rx="2">
        <animate attributeName="height" values="36;16;44;26;36" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="112;132;104;122;112" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="111" y="120" width="7" height="28" rx="2">
        <animate attributeName="height" values="24;42;14;38;24" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="124;106;134;110;124" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="122" y="110" width="7" height="38" rx="2">
        <animate attributeName="height" values="38;20;34;46;38" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="110;128;114;102;110" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="133" y="124" width="7" height="24" rx="2">
        <animate attributeName="height" values="18;36;28;14;18" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="130;112;120;134;130" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Bottom Caption Pill Strictly Inside Container -->
    <rect x="28" y="268" width="144" height="24" rx="12" fill="#1e202c" stroke="#34384c"/>
    <text x="100" y="284" text-anchor="middle" fill="#b4b9ce" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">3D WebGL · Three.js</text>
  </g>

  <!-- Right Column: Bounded Width 576px (ends at x=872 < 920) -->
  <g transform="translate(296, 36)">
    <!-- Top Live Pill -->
    <rect x="0" y="0" width="236" height="26" rx="13" fill="#ff6a00" fill-opacity="0.15" stroke="#ff6a00" stroke-opacity="0.45"/>
    <circle cx="16" cy="13" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="29" y="17" fill="#ffb37a" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="700">LIVE DEMO · БЕЗ КОЛОНКИ И ADB</text>

    <!-- Heading & Subtitle -->
    <text x="0" y="60" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="25" font-weight="800">Интерактивный 3D-эмулятор панели</text>
    <text x="0" y="88" fill="#b4b9cc" font-family="system-ui,-apple-system,sans-serif" font-size="14">Покрутите 3D-модель Станции Макс, покликайте все вкладки,</text>
    <text x="0" y="110" fill="#b4b9cc" font-family="system-ui,-apple-system,sans-serif" font-size="14">10-полосный DSP, светомузыку Tuya, караоке и root-терминал.</text>

    <!-- Comical Now Playing Card -->
    <rect x="0" y="128" width="576" height="76" rx="16" fill="#1a1c27" stroke="#303447"/>
    <rect x="14" y="142" width="48" height="48" rx="12" fill="#ff6a00" fill-opacity="0.2" stroke="#ff6a00" stroke-opacity="0.5"/>
    <text x="38" y="173" text-anchor="middle" fill="#ff9e59" font-family="system-ui,sans-serif" font-size="21">🔊</text>
    <text x="76" y="161" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700">DJ Несущая Стена — Перфоратор соседа (10H Bass)</text>
    <text x="76" y="181" fill="#9ca3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12">Караоке · YouTube Music (−14 LUFS: +8.4 dB → ×0.38) · Синт-звук</text>
    <rect x="76" y="191" width="482" height="4" rx="2" fill="#2d3142"/>
    <rect x="76" y="191" width="180" height="4" rx="2" fill="#ff6a00">
      <animate attributeName="width" values="90;420;90" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom CTA Button & URL Pill -->
    <rect x="0" y="220" width="284" height="44" rx="12" fill="url(#ctaGrad)"/>
    <text x="142" y="247" text-anchor="middle" fill="#111116" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800">▶ ОТКРЫТЬ 3D-ЭМУЛЯТОР</text>

    <rect x="296" y="220" width="280" height="44" rx="12" fill="#161822" stroke="#313548"/>
    <text x="436" y="246" text-anchor="middle" fill="#aeb5c9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600">timobzdecc.github.io/yapanel-web_max</text>
  </g>
</svg>
